<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AXO Workflow</title>
<style>
:root{--bg:#0b0b0d;--card:#1b1b1f;--line:#2c2c33;--text:#f1f1f2;--muted:#8d8d95;--blue:#3989f6;--green:#5ecb91;--amber:#f2b84b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;background:rgba(11,11,13,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
#bar h1{font-size:15px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{background:#26262c;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer}
#bar button.go{background:var(--blue);border-color:var(--blue)}
#stage{position:absolute;inset:54px 0 0 0;overflow:auto;background-image:radial-gradient(#2a2a31 1px,transparent 1px);background-size:22px 22px}
#canvas{position:relative;margin:0 auto}
svg#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.wire{fill:none;stroke:#3a5f96;stroke-width:2;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset .6s ease}
.wire.on{stroke-dashoffset:0}.wire.hot{stroke:var(--blue);filter:drop-shadow(0 0 4px var(--blue))}
.wl{position:absolute;font-size:11px;color:var(--muted);background:var(--bg);padding:1px 6px;border-radius:8px;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
.wl.on{opacity:1}
.node{position:absolute;width:250px;min-height:70px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:flex;gap:12px;align-items:center;opacity:0;transform:translateY(14px) scale(.96);transition:all .45s cubic-bezier(.2,.9,.3,1.2)}
.node.on{opacity:1;transform:none}
.node .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:none;background:#26262c}
.node .ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.node.trigger .ic{color:var(--green);background:#1d3329}.node.action .ic{color:#6ea8ff;background:#1c2a44}.node.end .ic{color:var(--green);background:#1d3329}.node.condition .ic{color:#4da3ff}
.node b{display:block;font-size:14px;font-weight:600}.node small{color:var(--muted);font-size:12px}
.node .st{display:block;font-size:11.5px;margin-top:3px;color:var(--green)}
.node.condition{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#25252c;justify-content:center;text-align:center;width:250px;min-height:110px;border:0;padding:0 50px}.node.condition .ic{display:none}.node.condition b{font-size:13px}.node.condition .st{font-size:10.5px}
.node.running{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 26px rgba(57,137,246,.55)}
.node.condition.running{background:#223250}
.node.done .st{display:block}
.node.warn .st{color:var(--amber)}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1b1b1f;border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;color:var(--muted);z-index:5}
#intro{position:fixed;inset:54px 0 0;display:grid;place-items:center;z-index:4;background:var(--bg);transition:opacity .5s}
#intro div{text-align:center;color:var(--muted);font-size:14px}
#intro i{display:block;width:38px;height:38px;margin:0 auto 14px;border:3px solid #2c2c33;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div id="bar"><h1 id="ttl">Building workflow…</h1><button id="again">New idea</button><button id="run" class="go">▶ Run</button><button id="exp">Save PNG-free JSON</button></div>
<div id="intro"><div><i></i>Designing your workflow…</div></div>
<div id="stage"><div id="canvas"><svg id="wires"></svg></div></div>
<div id="msg">Waiting…</div>
<script>
const ICONS={calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',database:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',webhook:'<circle cx="12" cy="6" r="2.5"/><circle cx="6" cy="17" r="2.5"/><circle cx="18" cy="17" r="2.5"/><path d="m11 8.5-4 6M13 8.5l4 6M8.5 17h7"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/>',bolt:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',filter:'<path d="M3 5h18l-7 8v6l-4-2v-4z"/>',bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',chat:'<path d="M21 12a8 8 0 0 1-11.5 7L3 21l2-5.5A8 8 0 1 1 21 12z"/>',code:'<path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',cloud:'<path d="M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.5 7z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',sheet:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>',ai:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>'};
const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',W=250,GX=290,GY=150;
let G=null,timers=[];
const wait=ms=>new Promise(r=>timers.push(setTimeout(r,ms)));
function layout(nodes){
  const by=Object.fromEntries(nodes.map(n=>[n.id,n])),lvl={};
  const depth=(id,seen=new Set())=>{if(lvl[id]!=null)return lvl[id];return 0};
  nodes.forEach(n=>lvl[n.id]=0);
  for(let k=0;k<nodes.length;k++)nodes.forEach(n=>(n.next||[]).forEach(t=>{if(by[t]&&lvl[t]<lvl[n.id]+1&&lvl[n.id]<nodes.length)lvl[t]=lvl[n.id]+1}));
  const rows={};nodes.forEach(n=>(rows[lvl[n.id]]??=[]).push(n));
  const pos={};const maxCols=Math.max(...Object.values(rows).map(r=>r.length));
  // lay out: place children under parent; spread siblings
  const placed={};
  Object.keys(rows).map(Number).sort((a,b)=>a-b).forEach(l=>{
    rows[l].forEach((n,i)=>{
      const parents=nodes.filter(p=>(p.next||[]).includes(n.id)&&placed[p.id]!=null);
      let x=parents.length?parents.reduce((s,p)=>s+placed[p.id],0)/parents.length:0;
      const pp=parents[0];if(pp&&pp.next.length>1){x=placed[pp.id]+(pp.next.indexOf(n.id)-0.5)*GX}
      placed[n.id]=x;
    });
    // resolve collisions in the same row
    const r=rows[l].slice().sort((a,b)=>placed[a.id]-placed[b.id]);
    for(let i=1;i<r.length;i++)if(placed[r[i].id]-placed[r[i-1].id]<GX)placed[r[i].id]=placed[r[i-1].id]+GX;
  });
  const xs=Object.values(placed),min=Math.min(...xs);
  nodes.forEach(n=>pos[n.id]={x:placed[n.id]-min+30,y:lvl[n.id]*GY+30,lvl:lvl[n.id]});
  return pos;
}
function build(data){
  G=data;$('#ttl').textContent=data.title||'Workflow';document.title='AXO · '+$('#ttl').textContent;
  const cv=$('#canvas'),svg=$('#wires');[...cv.querySelectorAll('.node,.wl')].forEach(e=>e.remove());svg.innerHTML='';
  const pos=layout(data.nodes);G.pos=pos;
  const w=Math.max(...Object.values(pos).map(p=>p.x))+W+40,h=Math.max(...Object.values(pos).map(p=>p.y))+170;
  cv.style.width=Math.max(w,innerWidth-4)+'px';cv.style.height=h+'px';
  if(w<innerWidth){const off=(innerWidth-w)/2;Object.values(pos).forEach(p=>p.x+=off)}
  svg.setAttribute('width',cv.style.width);svg.setAttribute('height',h);
  data.nodes.forEach(n=>{const p=pos[n.id],d=document.createElement('div');d.className='node '+n.type;d.id='nd-'+n.id;d.style.left=p.x+'px';d.style.top=p.y+'px';
    d.innerHTML=`<div class="ic"><svg viewBox="0 0 24 24">${ICONS[n.icon]||ICONS.bolt}</svg></div><div><b>${esc(n.title)}</b><small>${esc(n.sub||'')}</small><span class="st" style="display:none"></span></div>`;
    cv.append(d);n._h=d.offsetHeight;});
  data.nodes.forEach(n=>(n.next||[]).forEach((t,i)=>{const a=pos[n.id],b=pos[t];if(!b)return;
    const ah=n.type==='condition'?110:G.nodes.find(x=>x.id===n.id)._h||70;
    const x1=a.x+W/2,y1=a.y+ah,x2=b.x+W/2,y2=b.y,my=(y1+y2)/2;
    const path=document.createElementNS(NS,'path');path.setAttribute('d',`M${x1} ${y1}C${x1} ${my},${x2} ${my},${x2} ${y2}`);path.setAttribute('class','wire');path.id=`w-${n.id}-${t}`;svg.append(path);
    const L=path.getTotalLength();path.style.setProperty('--len',L);path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
    if(n.labels&&n.labels[i]){const l=document.createElement('div');l.className='wl';l.id=`wl-${n.id}-${t}`;l.textContent=n.labels[i];l.style.left=(x1+x2)/2+'px';l.style.top=my+'px';cv.append(l)}}));
}
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function reveal(){
  $('#msg').textContent='Building…';
  const order=[...G.nodes].sort((a,b)=>G.pos[a.id].lvl-G.pos[b.id].lvl);
  for(const n of order){
    (G.nodes.filter(p=>(p.next||[]).includes(n.id))).forEach(p=>{$(`#w-${p.id}-${n.id}`)?.classList.add('on');$(`#wl-${p.id}-${n.id}`)?.classList.add('on')});
    await wait(260);$('#nd-'+n.id).classList.add('on');await wait(220);
  }
  $('#msg').textContent='Ready — press Run to simulate';
}
async function run(){
  timers.forEach(clearTimeout);$('#run').disabled=true;document.querySelectorAll('.node').forEach(n=>{n.classList.remove('running','done');n.querySelector('.st').style.display='none'});
  document.querySelectorAll('.wire').forEach(w=>w.classList.remove('hot'));
  const by=Object.fromEntries(G.nodes.map(n=>[n.id,n]));let cur=G.nodes[0];const seen=new Set();
  while(cur&&!seen.has(cur.id)){
    seen.add(cur.id);const el=$('#nd-'+cur.id);el.classList.add('running');$('#msg').textContent='Running: '+cur.title;await wait(900);
    el.classList.remove('running');el.classList.add('done');const st=el.querySelector('.st');st.style.display='block';
    const t=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    if(cur.type==='condition'){st.textContent='Branch chosen · '+t}else st.innerHTML='✔ Success &nbsp;'+t;
    const nx=cur.next||[];const pick=nx[0];if(pick)$(`#w-${cur.id}-${pick}`)?.classList.add('hot');cur=by[pick];
  }
  $('#msg').textContent='Run complete';$('#run').disabled=false;
}
async function boot(){
  let req;try{req=JSON.parse(localStorage.getItem('axo_wf_req')||'null')}catch{}
  const q=new URLSearchParams(location.search);const prompt=(req&&req.prompt)||q.get('q')||'';
  if(!prompt){$('#intro').firstElementChild.innerHTML='Ask AXO: “build me a workflow chart for mails”.';return}
  try{
    const r=await fetch('/api/workflow',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,ai:(req&&req.ai)||{}})});
    const d=await r.json();if(!d.ok)throw new Error(d.error);
    build(d);$('#intro').style.opacity=0;setTimeout(()=>$('#intro').remove(),500);
    if(d.fallback)$('#msg').textContent='Sample layout (add an AI key in Settings for custom charts)';
    await reveal();
  }catch(e){$('#intro').firstElementChild.textContent='Could not build: '+e.message}
}
$('#run').onclick=()=>G&&run();
$('#again').onclick=()=>{const p=prompt('Describe the workflow:');if(p){localStorage.setItem('axo_wf_req',JSON.stringify({...(JSON.parse(localStorage.getItem('axo_wf_req')||'{}')),prompt:p}));location.reload()}};
$('#exp').textContent='Copy JSON';$('#exp').onclick=()=>{navigator.clipboard?.writeText(JSON.stringify({title:G.title,nodes:G.nodes.map(({_h,...n})=>n)},null,2));$('#msg').textContent='Copied workflow JSON'};
boot();
</script></body></html>
